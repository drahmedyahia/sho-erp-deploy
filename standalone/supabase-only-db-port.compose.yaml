                              - match:
                                  prefix: /mcp
                                route:
                                  cluster: studio
                                  prefix_rewrite: /api/mcp
                                  timeout: 30s
                                request_headers_to_add:
                                  - header:
                                      key: X-Forwarded-Prefix
                                      value: /mcp
                                    append_action: ADD_IF_ABSENT
                                typed_per_filter_config:
                                  envoy.filters.http.basic_auth:
                                    '@type': >-
                                      type.googleapis.com/envoy.config.route.v3.FilterConfig
                                    disabled: true
                                  envoy.filters.http.rbac:
                                    '@type': >-
                                      type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                    # Block access to /mcp by default
                                    rbac:
                                      rules:
                                        action: DENY
                                        policies:
                                          deny_all:
                                            permissions:
                                              - any: true
                                            principals:
                                              - any: true
                                    # Enable local access (danger zone!)
                                    # 1. Comment out the 'rbac' block above.
                                    # 2. Uncomment and adjust the 'rbac' block below.
                                    # 3. Add or adjust your local IPs in 'principals'.
                                    #rbac:
                                    #  rules:
                                    #    action: ALLOW
                                    #    policies:
                                    #      allow_local:
                                    #        permissions:
                                    #          - any: true
                                    #        principals:
                                    #          - direct_remote_ip:
                                    #              address_prefix: 127.0.0.1
                                    #              prefix_len: 32
                                    #          - direct_remote_ip:
                                    #              address_prefix: ::1
                                    #              prefix_len: 128

                              - match:
                                  prefix: /
                                route:
                                  cluster: studio
                                  timeout: 30s
                                request_headers_to_remove:
                                  - authorization
                                request_headers_to_add:
                                  - header:
                                      key: X-Forwarded-Prefix
                                      value: /
                                    append_action: ADD_IF_ABSENT
                                typed_per_filter_config:
                                  envoy.filters.http.rbac:
                                    '@type': >-
                                      type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                    rbac:
                                      rules:
                                        action: ALLOW
                                        policies:
                                          allow_all:
                                            permissions:
                                              - any: true
                                            principals:
                                              - any: true

                      http_filters:
                        - name: envoy.filters.http.cors
                          typed_config:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                        - name: envoy.filters.http.basic_auth
                          typed_config:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.basic_auth.v3.BasicAuth
                            users:
                              inline_string: '$${DASHBOARD_BASIC_AUTH}'

                        # Copies ?apikey=... from the URL into the apikey header when clients omit the header.
                        - name: envoy.filters.http.lua
                          typed_config:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                            inline_code: |
                              local FUNCTIONS_ROUTE = "functions-v1-all"
                              local FUNCTIONS_PREFIX = "/functions/v1/"

                              local function is_functions_request(request_handle, headers)
                                if request_handle:streamInfo():routeName() == FUNCTIONS_ROUTE then
                                  return true
                                end

                                local path = headers:get(":path")
                                if path == nil then
                                  return false
                                end

                                return string.sub(path, 1, string.len(FUNCTIONS_PREFIX)) == FUNCTIONS_PREFIX
                              end

                              function envoy_on_request(request_handle)
                                local headers = request_handle:headers()
                                if is_functions_request(request_handle, headers) then
                                  return
                                end

                                if headers:get("apikey") ~= nil then
                                  return
                                end

                                local path = headers:get(":path")
                                local query_start = string.find(path, "?", 1, true)
                                if query_start == nil then
                                  return
                                end

                                local query = string.sub(path, query_start + 1)
                                for key, value in string.gmatch(query, "([^&]+)=([^&]*)") do
                                  if key == "apikey" and value ~= "" then
                                    headers:add("apikey", value)
                                    return
                                  end
                                end
                              end

                        # Returns 401 for missing/invalid API keys on protected API routes.
                        - name: envoy.filters.http.lua
                          typed_config:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                            inline_code: |
                              local ANON_KEY = "$${ANON_KEY}"
                              local SERVICE_ROLE_KEY = "$${SERVICE_ROLE_KEY}"
                              local SUPABASE_PUBLISHABLE_KEY = "$${SUPABASE_PUBLISHABLE_KEY}"
                              local SUPABASE_SECRET_KEY = "$${SUPABASE_SECRET_KEY}"
                              local ANON_KEY_ASYMMETRIC = "$${ANON_KEY_ASYMMETRIC}"
                              local SERVICE_ROLE_KEY_ASYMMETRIC = "$${SERVICE_ROLE_KEY_ASYMMETRIC}"
                              local TRANSLATION_ENABLED = SUPABASE_SECRET_KEY ~= "" and SUPABASE_PUBLISHABLE_KEY ~= "" and SERVICE_ROLE_KEY_ASYMMETRIC ~= "" and ANON_KEY_ASYMMETRIC ~= ""

                              local PROTECTED_ROUTES = {
                                ["auth-v1-protected"] = true,
                                ["rest-v1-openapi-protected"] = true,
                                ["rest-v1-protected"] = true,
                                ["graphql-v1-protected"] = true,
                                ["realtime-v1-api-protected"] = true,
                                ["realtime-v1-ws-protected"] = true,
                                ["pg-protected"] = true,
                              }

                              local function is_protected_route(route_name)
                                if route_name == nil or route_name == "" then
                                  return false
                                end

                                return PROTECTED_ROUTES[route_name] == true
                              end

                              local function is_valid_apikey(apikey)
                                if apikey == nil or apikey == "" then
                                  return false
                                end

                                if SERVICE_ROLE_KEY ~= "" and apikey == SERVICE_ROLE_KEY then
                                  return true
                                end

                                if ANON_KEY ~= "" and apikey == ANON_KEY then
                                  return true
                                end

                                if TRANSLATION_ENABLED and apikey == SUPABASE_SECRET_KEY then
                                  return true
                                end

                                if TRANSLATION_ENABLED and apikey == SUPABASE_PUBLISHABLE_KEY then
                                  return true
                                end

                                return false
                              end

                              function envoy_on_request(request_handle)
                                local headers = request_handle:headers()
                                local route_name = request_handle:streamInfo():routeName()
                                if not is_protected_route(route_name) then
                                  return
                                end

                                if is_valid_apikey(headers:get("apikey")) then
                                  return
                                end

                                request_handle:respond({
                                  [":status"] = "401",
                                  ["content-type"] = "text/plain",
                                }, "Unauthorized")
                              end

                        # Translates the query parameter apikey into the matching internal JWT and rewrites the URL so only JWTs propagate downstream.
                        - name: envoy.filters.http.lua
                          typed_config:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                            inline_code: |
                              local FUNCTIONS_ROUTE = "functions-v1-all"
                              local FUNCTIONS_PREFIX = "/functions/v1/"
                              local SECRET_KEY = "$${SUPABASE_SECRET_KEY}"
                              local PUBLISHABLE_KEY = "$${SUPABASE_PUBLISHABLE_KEY}"
                              local SERVICE_ROLE_JWT = "$${SERVICE_ROLE_KEY_ASYMMETRIC}"
                              local ANON_JWT = "$${ANON_KEY_ASYMMETRIC}"
                              local TRANSLATION_ENABLED = SECRET_KEY ~= "" and PUBLISHABLE_KEY ~= "" and SERVICE_ROLE_JWT ~= "" and ANON_JWT ~= ""

                              local function is_functions_request(request_handle, headers)
                                if request_handle:streamInfo():routeName() == FUNCTIONS_ROUTE then
                                  return true
                                end

                                local path = headers:get(":path")
                                if path == nil then
                                  return false
                                end

                                return string.sub(path, 1, string.len(FUNCTIONS_PREFIX)) == FUNCTIONS_PREFIX
                              end

                              local function translate_apikey(apikey)
                                if apikey == nil or apikey == "" then
                                  return nil
                                end

                                if not TRANSLATION_ENABLED then
                                  return nil
                                end

                                if apikey == SECRET_KEY then
                                  return SERVICE_ROLE_JWT
                                end

                                if apikey == PUBLISHABLE_KEY then
                                  return ANON_JWT
                                end

                                return nil
                              end

                              local function extract_query_apikey(path)
                                if path == nil or path == "" then
                                  return nil
                                end

                                local query_start = string.find(path, "?", 1, true)
                                if query_start == nil then
                                  return nil
                                end

                                local query = string.sub(path, query_start + 1)
                                for key, value in string.gmatch(query, "([^&]+)=([^&]*)") do
                                  if key == "apikey" and value ~= "" then
                                    return value
                                  end
                                end

                                return nil
                              end

                              local function replace_query_apikey(path, new_value)
                                if path == nil or path == "" or new_value == nil or new_value == "" then
                                  return nil
                                end

                                local query_start = string.find(path, "?", 1, true)
                                if query_start == nil then
                                  return nil
                                end

                                local base = string.sub(path, 1, query_start)
                                local query = string.sub(path, query_start + 1)
                                local updated = {}
                                local replaced = false

                                for part in string.gmatch(query, "([^&]+)") do
                                  local key, value = string.match(part, "([^=]+)=(.*)")
                                  if key == "apikey" then
                                    part = key .. "=" .. new_value
                                    replaced = true
                                  end
                                  table.insert(updated, part)
                                end

                                if not replaced then
                                  return nil
                                end

                                return base .. table.concat(updated, "&")
                              end

                              function envoy_on_request(request_handle)
                                local headers = request_handle:headers()
                                if is_functions_request(request_handle, headers) then
                                  return
                                end

                                local path = headers:get(":path")
                                local apikey = extract_query_apikey(path)
                                local translated = translate_apikey(apikey)

                                if translated == nil then
                                  return
                                end

                                headers:replace("apikey", translated)

                                local rewritten_path = replace_query_apikey(path, translated)
                                if rewritten_path ~= nil then
                                  headers:replace(":path", rewritten_path)
                                end
                              end

                        # Translates an apikey header into the appropriate internal JWT for downstream RBAC checks.
                        - name: envoy.filters.http.lua
                          typed_config:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                            inline_code: |
                              local FUNCTIONS_ROUTE = "functions-v1-all"
                              local FUNCTIONS_PREFIX = "/functions/v1/"
                              local SECRET_KEY = "$${SUPABASE_SECRET_KEY}"
                              local PUBLISHABLE_KEY = "$${SUPABASE_PUBLISHABLE_KEY}"
                              local SERVICE_ROLE_JWT = "$${SERVICE_ROLE_KEY_ASYMMETRIC}"
                              local ANON_JWT = "$${ANON_KEY_ASYMMETRIC}"
                              local TRANSLATION_ENABLED = SECRET_KEY ~= "" and PUBLISHABLE_KEY ~= "" and SERVICE_ROLE_JWT ~= "" and ANON_JWT ~= ""

                              local function is_functions_request(request_handle, headers)
                                if request_handle:streamInfo():routeName() == FUNCTIONS_ROUTE then
                                  return true
                                end

                                local path = headers:get(":path")
                                if path == nil then
                                  return false
                                end

                                return string.sub(path, 1, string.len(FUNCTIONS_PREFIX)) == FUNCTIONS_PREFIX
                              end

                              local function translate_apikey(apikey)
                                if apikey == nil or apikey == "" then
                                  return nil
                                end

                                if not TRANSLATION_ENABLED then
                                  return nil
                                end

                                if apikey == SECRET_KEY then
                                  return SERVICE_ROLE_JWT
                                end

                                if apikey == PUBLISHABLE_KEY then
                                  return ANON_JWT
                                end

                                return nil
                              end

                              function envoy_on_request(request_handle)
                                local headers = request_handle:headers()
                                if is_functions_request(request_handle, headers) then
                                  return
                                end

                                local translated = translate_apikey(headers:get("apikey"))
                                if translated ~= nil and translated ~= "" then
                                  headers:replace("apikey", translated)
                                end
                              end

                        # Mirrors apikey into x-api-key for realtime WS compatibility.
                        - name: envoy.filters.http.lua
                          typed_config:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                            inline_code: |
                              local REALTIME_WS_ROUTE = "realtime-v1-ws-protected"

                              function envoy_on_request(request_handle)
                                local route_name = request_handle:streamInfo():routeName()
                                if route_name ~= REALTIME_WS_ROUTE then
                                  return
                                end

                                local headers = request_handle:headers()
                                local apikey = headers:get("apikey")
                                if apikey == nil or apikey == "" then
                                  return
                                end

                                headers:replace("x-api-key", apikey)
                              end

                        # Synthesizes an Authorization header (Bearer …) from apikey when callers don’t provide a real JWT header.
                        - name: envoy.filters.http.lua
                          typed_config:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                            inline_code: |
                              local FUNCTIONS_ROUTE = "functions-v1-all"
                              local FUNCTIONS_PREFIX = "/functions/v1/"
                              local REALTIME_WS_ROUTE = "realtime-v1-ws-protected"

                              local function is_functions_request(request_handle, headers)
                                if request_handle:streamInfo():routeName() == FUNCTIONS_ROUTE then
                                  return true
                                end

                                local path = headers:get(":path")
                                if path == nil then
                                  return false
                                end

                                return string.sub(path, 1, string.len(FUNCTIONS_PREFIX)) == FUNCTIONS_PREFIX
                              end

                              local function has_real_jwt(auth_header)
                                if auth_header == nil or auth_header == "" then
                                  return false
                                end

                                if string.sub(auth_header, 1, 7) ~= "Bearer " then
                                  return false
                                end

                                return string.sub(auth_header, 1, 10) ~= "Bearer sb_"
                              end

                              local function format_authorization(value)
                                if value == nil or value == "" then
                                  return nil
                                end

                                if string.sub(value, 1, 7) == "Bearer " then
                                  return value
                                end

                                return "Bearer " .. value
                              end

                              function envoy_on_request(request_handle)
                                local headers = request_handle:headers()
                                if request_handle:streamInfo():routeName() == REALTIME_WS_ROUTE then
                                  return
                                end

                                if is_functions_request(request_handle, headers) then
                                  return
                                end

                                if has_real_jwt(headers:get("authorization")) then
                                  return
                                end

                                local apikey = headers:get("apikey")
                                local authorization_value = format_authorization(apikey)
                                if authorization_value ~= nil then
                                  headers:replace("authorization", authorization_value)
                                end
                              end

                        - name: envoy.filters.http.rbac
                          typed_config:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                            rules:
                              action: ALLOW
                              policies:
                                admin:
                                  permissions:
                                    - url_path:
                                        path:
                                          prefix: /pg/
                                  principals:
                                    - header:
                                        name: apikey
                                        string_match:
                                          exact: '$${SERVICE_ROLE_KEY}'
                                    - header:
                                        name: apikey
                                        string_match:
                                          exact: '$${SERVICE_ROLE_KEY_ASYMMETRIC}'
                                apikey:
                                  permissions:
                                    - url_path:
                                        path:
                                          prefix: /auth/v1/
                                    - url_path:
                                        path:
                                          prefix: /rest/v1/
                                    - url_path:
                                        path:
                                          prefix: /realtime/v1/api
                                    - url_path:
                                        path:
                                          prefix: /realtime/v1/
                                    - url_path:
                                        path:
                                          prefix: /graphql/v1
                                  principals:
                                    - header:
                                        name: apikey
                                        string_match:
                                          exact: '$${SERVICE_ROLE_KEY}'
                                    - header:
                                        name: apikey
                                        string_match:
                                          exact: '$${ANON_KEY}'
                                    - header:
                                        name: apikey
                                        string_match:
                                          exact: '$${SERVICE_ROLE_KEY_ASYMMETRIC}'
                                    - header:
                                        name: apikey
                                        string_match:
                                          exact: '$${ANON_KEY_ASYMMETRIC}'
                        - name: envoy.filters.http.router
                          typed_config:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        SHO_ERP_EOF_3
        chmod 0644 /etc/envoy/lds.template.yaml
        mkdir -p /
        cat > /supabase-entrypoint.sh <<'SHO_ERP_EOF_4'
        #!/bin/sh
        set -e

        # Generate SHA1 base64 hash for Envoy basic auth user list
        PASSWORD_HASH=$$(printf '%s' "$${DASHBOARD_PASSWORD}" | openssl sha1 -binary | openssl base64)
        DASHBOARD_BASIC_AUTH="$${DASHBOARD_USERNAME}:{SHA}$${PASSWORD_HASH}"

        echo "Generating Envoy configuration..."

        # Process the lds.yaml template with environment variables using sed
        # Using | as delimiter since JWT tokens contain /
        sed -e "s|\$${ANON_KEY}|$${ANON_KEY}|g" \
            -e "s|\$${ANON_KEY_ASYMMETRIC}|$${ANON_KEY_ASYMMETRIC}|g" \
            -e "s|\$${SERVICE_ROLE_KEY}|$${SERVICE_ROLE_KEY}|g" \
            -e "s|\$${SERVICE_ROLE_KEY_ASYMMETRIC}|$${SERVICE_ROLE_KEY_ASYMMETRIC}|g" \
            -e "s|\$${SUPABASE_PUBLISHABLE_KEY}|$${SUPABASE_PUBLISHABLE_KEY}|g" \
            -e "s|\$${SUPABASE_SECRET_KEY}|$${SUPABASE_SECRET_KEY}|g" \
            -e "s|\$${DASHBOARD_BASIC_AUTH}|$${DASHBOARD_BASIC_AUTH}|g" \
            /etc/envoy/lds.template.yaml > /etc/envoy/lds.yaml

        if [ -n "$$SUPABASE_SECRET_KEY" ] && \
           [ -n "$$SUPABASE_PUBLISHABLE_KEY" ] && \
           [ -n "$$SERVICE_ROLE_KEY_ASYMMETRIC" ] && \
           [ -n "$$ANON_KEY_ASYMMETRIC" ]; then
          echo "Envoy sb_ key translation enabled"
        else
          echo "Envoy running in legacy API key mode (sb_ keys disabled)"
        fi

        echo "Envoy configuration generated successfully"
        echo "Starting Envoy..."

        # Start Envoy
        exec envoy -c /etc/envoy/envoy.yaml "$$@"
        SHO_ERP_EOF_4
        chmod 0644 /supabase-entrypoint.sh
        exec /bin/sh /supabase-entrypoint.sh "$$@"
      - '--'
  auth:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - http://localhost:9999/health
      timeout: 5s
      interval: 5s
      start_period: 300s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
  rest:
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - postgrest
        - '--ready'
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command:
      - postgrest
  realtime:
    image: supabase/realtime:v2.102.3
    restart: unless-stopped
    networks:
      default:
        aliases:
          - realtime-dev.supabase-realtime
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -sSfL --head -o /dev/null -H "Authorization: Bearer ${ANON_KEY}" http://localhost:4000/api/tenants/realtime-dev/health'
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 300s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: '-proto_dist inet_tcp'
      DNS_NODES: ''''''
      RLIMIT_NOFILE: '10000'
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      RUN_JANITOR: 'true'
      DISABLE_HEALTHCHECK_LOGGING: 'true'
  storage:
    image: supabase/storage-api:v1.60.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - http://storage:5000/status
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 300s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
      FILE_SIZE_LIMIT: 2147483648
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID}
      REGION: ${REGION}
      ENABLE_IMAGE_TRANSFORMATION: 'false'
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - ${STORAGE_DATA:-storage-data}:/var/lib/storage
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - ${DB_DATA:-db-data}:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-U'
        - postgres
        - '-h'
        - localhost
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 60
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      - postgres
      - '-c'
      - config_file=/etc/postgresql/postgresql.conf
      - '-c'
      - log_min_messages=fatal
    networks:
      default:
        aliases:
          - ${SUPABASE_NETWORK:-sho-supabase}-db
    ports:
      - ${DB_BIND:-127.0.0.1}:${DB_PORT:-55432}:${POSTGRES_PORT}
    entrypoint:
      - /bin/sh
      - '-c'
      - |
        set -e
        mkdir -p /docker-entrypoint-initdb.d/migrations
        cat > /docker-entrypoint-initdb.d/migrations/99-realtime.sql <<'SHO_ERP_EOF_1'
        \set pguser `echo "$$POSTGRES_USER"`

        create schema if not exists _realtime;
        alter schema _realtime owner to :pguser;
        SHO_ERP_EOF_1
        chmod 0644 /docker-entrypoint-initdb.d/migrations/99-realtime.sql
        mkdir -p /docker-entrypoint-initdb.d/init-scripts
        cat > /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql <<'SHO_ERP_EOF_2'
        BEGIN;
          -- Create pg_net extension
          CREATE EXTENSION IF NOT EXISTS pg_net SCHEMA extensions;
          -- Create supabase_functions schema
          CREATE SCHEMA supabase_functions AUTHORIZATION supabase_admin;
          GRANT USAGE ON SCHEMA supabase_functions TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
          -- supabase_functions.migrations definition
          CREATE TABLE supabase_functions.migrations (
            version text PRIMARY KEY,
            inserted_at timestamptz NOT NULL DEFAULT NOW()
          );
          -- Initial supabase_functions migration
          INSERT INTO supabase_functions.migrations (version) VALUES ('initial');
          -- supabase_functions.hooks definition
          CREATE TABLE supabase_functions.hooks (
            id bigserial PRIMARY KEY,
            hook_table_id integer NOT NULL,
            hook_name text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT NOW(),
            request_id bigint
          );
          CREATE INDEX supabase_functions_hooks_request_id_idx ON supabase_functions.hooks USING btree (request_id);
          CREATE INDEX supabase_functions_hooks_h_table_id_h_name_idx ON supabase_functions.hooks USING btree (hook_table_id, hook_name);
          COMMENT ON TABLE supabase_functions.hooks IS 'Supabase Functions Hooks: Audit trail for triggered hooks.';
          CREATE FUNCTION supabase_functions.http_request()
            RETURNS trigger
            LANGUAGE plpgsql
            AS $$function$$
            DECLARE
              request_id bigint;
              payload jsonb;
              url text := TG_ARGV[0]::text;
              method text := TG_ARGV[1]::text;
              headers jsonb DEFAULT '{}'::jsonb;
              params jsonb DEFAULT '{}'::jsonb;
              timeout_ms integer DEFAULT 1000;
            BEGIN
              IF url IS NULL OR url = 'null' THEN
                RAISE EXCEPTION 'url argument is missing';
              END IF;

              IF method IS NULL OR method = 'null' THEN
                RAISE EXCEPTION 'method argument is missing';
              END IF;

              IF TG_ARGV[2] IS NULL OR TG_ARGV[2] = 'null' THEN
                headers = '{"Content-Type": "application/json"}'::jsonb;
              ELSE
                headers = TG_ARGV[2]::jsonb;
              END IF;

              IF TG_ARGV[3] IS NULL OR TG_ARGV[3] = 'null' THEN
                params = '{}'::jsonb;
              ELSE
                params = TG_ARGV[3]::jsonb;
              END IF;

              IF TG_ARGV[4] IS NULL OR TG_ARGV[4] = 'null' THEN
                timeout_ms = 1000;
              ELSE
                timeout_ms = TG_ARGV[4]::integer;
              END IF;

              CASE
                WHEN method = 'GET' THEN
                  SELECT http_get INTO request_id FROM net.http_get(
                    url,
                    params,
                    headers,
                    timeout_ms
                  );
                WHEN method = 'POST' THEN
                  payload = jsonb_build_object(
                    'old_record', OLD,
                    'record', NEW,
                    'type', TG_OP,
                    'table', TG_TABLE_NAME,
                    'schema', TG_TABLE_SCHEMA
                  );

                  SELECT http_post INTO request_id FROM net.http_post(
                    url,
                    payload,
                    params,
                    headers,
                    timeout_ms
                  );
                ELSE
                  RAISE EXCEPTION 'method argument % is invalid', method;
              END CASE;

              INSERT INTO supabase_functions.hooks
                (hook_table_id, hook_name, request_id)
              VALUES
                (TG_RELID, TG_NAME, request_id);

              RETURN NEW;
            END
          $$function$$;
          -- Supabase super admin
          DO
          $$$$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = 'supabase_functions_admin'
            )
            THEN
              CREATE USER supabase_functions_admin NOINHERIT CREATEROLE LOGIN NOREPLICATION;
            END IF;
          END
          $$$$;
          GRANT ALL PRIVILEGES ON SCHEMA supabase_functions TO supabase_functions_admin;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA supabase_functions TO supabase_functions_admin;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA supabase_functions TO supabase_functions_admin;
          ALTER USER supabase_functions_admin SET search_path = "supabase_functions";
          ALTER table "supabase_functions".migrations OWNER TO supabase_functions_admin;
          ALTER table "supabase_functions".hooks OWNER TO supabase_functions_admin;
          ALTER function "supabase_functions".http_request() OWNER TO supabase_functions_admin;
          GRANT supabase_functions_admin TO postgres;
          -- Remove unused supabase_pg_net_admin role
          DO
          $$$$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = 'supabase_pg_net_admin'
            )
            THEN
              REASSIGN OWNED BY supabase_pg_net_admin TO supabase_admin;
              DROP OWNED BY supabase_pg_net_admin;
              DROP ROLE supabase_pg_net_admin;
            END IF;
          END
          $$$$;
          -- pg_net grants when extension is already enabled
          DO
          $$$$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_extension
              WHERE extname = 'pg_net'
            )
            THEN
              GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            END IF;
          END
          $$$$;
          -- Event trigger for pg_net
          CREATE OR REPLACE FUNCTION extensions.grant_pg_net_access()
          RETURNS event_trigger
          LANGUAGE plpgsql
          AS $$$$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_event_trigger_ddl_commands() AS ev
              JOIN pg_extension AS ext
              ON ev.objid = ext.oid
              WHERE ext.extname = 'pg_net'
            )
            THEN
              GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
              ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
              REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
            END IF;
          END;
          $$$$;
          COMMENT ON FUNCTION extensions.grant_pg_net_access IS 'Grants access to pg_net';
          DO
          $$$$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_event_trigger
              WHERE evtname = 'issue_pg_net_access'
            ) THEN
              CREATE EVENT TRIGGER issue_pg_net_access ON ddl_command_end WHEN TAG IN ('CREATE EXTENSION')
              EXECUTE PROCEDURE extensions.grant_pg_net_access();
            END IF;
          END
          $$$$;
          INSERT INTO supabase_functions.migrations (version) VALUES ('20210809183423_update_grants');
          ALTER function supabase_functions.http_request() SECURITY DEFINER;
          ALTER function supabase_functions.http_request() SET search_path = supabase_functions;
          REVOKE ALL ON FUNCTION supabase_functions.http_request() FROM PUBLIC;
          GRANT EXECUTE ON FUNCTION supabase_functions.http_request() TO postgres, anon, authenticated, service_role;
        COMMIT;
        SHO_ERP_EOF_2
        chmod 0644 /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
        mkdir -p /docker-entrypoint-initdb.d/init-scripts
        cat > /docker-entrypoint-initdb.d/init-scripts/99-roles.sql <<'SHO_ERP_EOF_3'
        -- NOTE: change to your own passwords for production environments
        \set pgpass `echo "$$POSTGRES_PASSWORD"`

        ALTER USER authenticator WITH PASSWORD :'pgpass';
        ALTER USER pgbouncer WITH PASSWORD :'pgpass';
        ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
        ALTER USER supabase_functions_admin WITH PASSWORD :'pgpass';
        ALTER USER supabase_storage_admin WITH PASSWORD :'pgpass';
        SHO_ERP_EOF_3
        chmod 0644 /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        mkdir -p /docker-entrypoint-initdb.d/init-scripts
        cat > /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql <<'SHO_ERP_EOF_4'
        \set jwt_secret `echo "$$JWT_SECRET"`
        \set jwt_exp `echo "$$JWT_EXP"`

        ALTER DATABASE postgres SET "app.settings.jwt_secret" TO :'jwt_secret';
        ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';
        SHO_ERP_EOF_4
        chmod 0644 /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
        exec docker-entrypoint.sh "$$@"
      - '--'
  studio:
    profiles:
      - admin
    image: supabase/studio:2026.08.03-sha-022b374
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ENABLED_FEATURES_LOGS_ALL: 'false'
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - snippets:/app/snippets
  meta:
    profiles:
      - admin
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
volumes:
  db-config: null
  db-data: null
  storage-data: null
  snippets: null
networks:
  default:
    name: ${SUPABASE_NETWORK:-sho-supabase}
